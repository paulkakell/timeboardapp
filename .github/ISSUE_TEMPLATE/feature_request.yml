name: Feature request
description: Describe a user problem, a proposed capability, and acceptance criteria.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem before proposing an implementation. Use synthetic examples; do not include credentials or private task data.
        Report vulnerabilities through [SECURITY.md](https://github.com/paulkakell/timeboardapp/blob/main/SECURITY.md), not this public form.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for similar proposals.
          required: true
        - label: This is not a security vulnerability report, and I removed private data and credentials.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/paulkakell/timeboardapp/blob/main/CODE_OF_CONDUCT.md).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Who encounters the problem, and what cannot they accomplish today?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Tasks and recurrence
        - Calendar and user interface
        - Notifications
        - API or private GPT Actions
        - Deployment and administration
        - Documentation or contributor workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change. Distinguish private GPT Actions from a new MCP or OAuth integration when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing options or explain why no suitable workaround is known.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give observable examples that would demonstrate the feature works.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration considerations
      description: Note effects on current users, API clients, stored data, configuration, accessibility, or a feature proposed for deprecation. State unknown when not yet assessed.
    validations:
      required: true

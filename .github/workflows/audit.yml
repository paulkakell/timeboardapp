name: Audit and regression tests
on:
  push:
    branches: ["audit/security-api-refresh-2026-09-26"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIMEBOARDAPP_SETTINGS: /tmp/timeboardapp-audit/settings.yml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve source and inventory
        run: |
          mkdir -p audit-evidence
          git archive -o audit-evidence/source.zip HEAD
          git ls-files > audit-evidence/files.txt
          python --version > audit-evidence/python.txt
          mkdir -p /tmp/timeboardapp-audit
          printf 'database:\n  path: /tmp/timeboardapp-audit/test.db\n' > "$TIMEBOARDAPP_SETTINGS"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install bandit
          python -m pip freeze > audit-evidence/installed.txt
          python -m pip check
      - name: Run regression suite
        id: tests
        continue-on-error: true
        run: python -m pytest -q --junitxml=audit-evidence/pytest.xml 2>&1 | tee audit-evidence/pytest.txt
      - name: Audit resolved dependencies
        id: dependencies
        continue-on-error: true
        run: python -m pip_audit --format=json --output=audit-evidence/pip-audit.json
      - name: Static security analysis
        id: static
        continue-on-error: true
        run: python -m bandit -r app -f json -o audit-evidence/bandit.json
      - name: Record dependency update candidates
        if: always()
        continue-on-error: true
        run: python -m pip list --outdated --format=json > audit-evidence/outdated.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence
          path: audit-evidence/
          retention-days: 14
      - name: Regression gate
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
        run: |
          test "$TEST_RESULT" = success
          test "$DEPENDENCY_RESULT" = success

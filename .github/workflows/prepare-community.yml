name: Prepare community update 00.13.02
on:
  push:
    branches: ['fix/release-intent-00.13.01']
    paths: ['.github/workflows/prepare-community.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'paulkakell/timeboardapp' && github.ref == 'refs/heads/fix/release-intent-00.13.01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify reviewed content and prepare an unreferenced tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import PurePosixPath
          repo = 'paulkakell/timeboardapp'
          base = '1c2184c92449a13e5022001c4e11151f376269d9'
          base_tree = '4b8d4425c69a1d01fbb4739218c3e520fcf7e3d0'
          expected = '0eff22001b006e9b2381db44003ee48bae73a65d'
          blobs = ['8cd013d25a13cc35cd68cfa7454f5eafdc4b2c79', '177eb0cb253cf5500880c989285922a3d85b5167', '8257574282108cf15af1c74ddff6ab412ef58350']
          def output(args):
              return subprocess.check_output(args, text=True).strip()
          assert output(['git', 'rev-parse', 'HEAD^']) == base
          assert output(['git', 'rev-parse', base+'^{tree}']) == base_tree
          encoded = b''.join(base64.b64decode(json.loads(output(['gh', 'api', f'repos/{repo}/git/blobs/{sha}']))['content']) for sha in blobs)
          raw = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '32d34fff7e86c4d5b16cd19690aae208f5ebc31422317921bccd2756ad14d7e7'
          changes = json.loads(raw)
          assert len(changes) == 38 and len({item['path'] for item in changes}) == 38
          entries = []
          for item in changes:
              path = PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not str(path).startswith('.github/workflows/')
              previous = subprocess.run(['git', 'show', f'{base}:{path}'], text=True, capture_output=True)
              before = previous.stdout if previous.returncode == 0 else ''
              assert hashlib.sha256(before.encode()).hexdigest() == item['before'], str(path)
              after = before
              for start, end, replacement in sorted(item['edits'], reverse=True):
                  assert 0 <= start <= end <= len(before)
                  after = after[:start] + replacement + after[end:]
              assert hashlib.sha256(after.encode()).hexdigest() == item['after'], str(path)
              entries.append(dict(path=str(path), mode='100644', type='blob', content=after))
          result = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/git/trees', '--input', '-'], input=json.dumps({'base_tree': base_tree, 'tree': entries}), text=True, capture_output=True, check=True)
          tree = json.loads(result.stdout)['sha']
          assert tree == expected, tree
          print('Verified community tree: '+tree)
          print('No main ref, tag, release, or deployment changed. Workflow edits stay on the authorized connector surface.')
          PY

name: Apply verified maintenance candidate
on:
  push:
    branches: [audit/security-api-refresh-2026-09-26]
    paths: ['.maintenance/source-update.*', '.github/workflows/apply-maintenance.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'paulkakell/timeboardapp' && github.ref == 'refs/heads/audit/security-api-refresh-2026-09-26'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/security-api-refresh-2026-09-26
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Apply exact source edits with before and after checksums
        run: |
          python - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path
          raw = b''.join(Path(f'.maintenance/source-update.{i}').read_bytes() for i in range(5))
          assert hashlib.sha256(raw).hexdigest() == '67daaf23e36115d2d8701e32a0a5218f670a81cd0768bb375c77da93fcc23885'
          bundle = json.loads(lzma.decompress(raw))
          for item in bundle['files']:
              p = Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] not in {'.git', '.github', '.maintenance'}
              old = p.read_bytes() if p.exists() else None
              before = hashlib.sha256(old).hexdigest() if old is not None else None
              assert before == item['before'], f'Base drift: {p}'
              if item['after'] is None:
                  p.unlink()
                  continue
              lines = old.decode().splitlines(keepends=True) if old is not None else []
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              result = ''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest() == item['after'], f'Patch mismatch: {p}'
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(result)
          print(f"Verified and applied {len(bundle['files'])} source changes")
          PY
      - name: Resolve hash-locked Python dependencies
        run: |
          python -m pip install 'pip-tools>=7,<8'
          rm requirements.txt requirements-dev.txt
          pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file=requirements.txt requirements.in
          pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file=requirements-dev.txt requirements-dev.in
      - name: Lock and vendor frontend packages
        run: |
          npm install --ignore-scripts
          python scripts/vendor_assets.py
      - name: Pin Python base image and synchronize website reference
        run: |
          docker pull python:3.13-slim
          docker image inspect python:3.13-slim --format '{{index .RepoDigests 0}}' > /tmp/base-image-digest
          python - <<'PY'
          from pathlib import Path
          digest = Path('/tmp/base-image-digest').read_text().strip().split('@', 1)[1]
          assert digest.startswith('sha256:') and len(digest) == 71
          p = Path('Dockerfile')
          p.write_text(p.read_text().replace('FROM python:3.13-slim', 'FROM python:3.13-slim@' + digest, 1))
          PY
          python scripts/sync_docs.py
      - name: Commit candidate to isolated audit branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'fix: harden authentication and outbound requests; add scoped GPT Actions, regression tests, locks and current docs'
          git push origin HEAD:refs/heads/audit/security-api-refresh-2026-09-26
          git rev-parse HEAD
      - name: Preserve candidate snapshot
        if: always()
        run: |
          mkdir -p audit-evidence
          git diff --binary > audit-evidence/uncommitted.patch
          git archive -o audit-evidence/source.zip HEAD
          python -m pip freeze > audit-evidence/bootstrap-tools.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maintenance-candidate
          path: audit-evidence/
          retention-days: 14

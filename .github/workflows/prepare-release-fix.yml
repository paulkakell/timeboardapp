name: Prepare release-intent fix 00.13.01
on:
  push:
    branches: ['fix/release-intent-00.13.01']
    paths: ['.github/workflows/prepare-release-fix.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'paulkakell/timeboardapp' && github.ref == 'refs/heads/fix/release-intent-00.13.01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build reviewed content tree without changing any refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import PurePosixPath
          repo = 'paulkakell/timeboardapp'
          base = '81cbec352bfde90ed7861460736ffdb6b53e7c5e'
          base_tree = '3ef7e1cc55d22cf16e29f5d8aa0e89d5f0968e66'
          def output(args):
              return subprocess.check_output(args, text=True).strip()
          assert output(['git', 'rev-parse', 'HEAD^']) == base
          assert output(['git', 'rev-parse', base+'^{tree}']) == base_tree
          blob = json.loads(output(['gh', 'api', f'repos/{repo}/git/blobs/c62390e891bcabbe8cfc7cd608debcb4b3f7ec48']))
          raw = lzma.decompress(base64.b64decode(blob['content']))
          assert hashlib.sha256(raw).hexdigest() == '2c917a7da973171944ab9d7b099c9996dbca4c4eb1b488977d0eb72de14b35cb'
          changes = json.loads(raw)
          assert len(changes) == 28
          entries = []
          for item in changes:
              path = PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert '.git' not in path.parts and '.github' not in path.parts
              prior = subprocess.run(['git', 'show', f'{base}:{path}'], text=True, capture_output=True)
              before = prior.stdout if prior.returncode == 0 else ''
              assert hashlib.sha256(before.encode()).hexdigest() == item['before'], str(path)
              after = before
              for start, end, replacement in sorted(item['edits'], reverse=True):
                  assert 0 <= start <= end <= len(before)
                  after = after[:start] + replacement + after[end:]
              assert hashlib.sha256(after.encode()).hexdigest() == item['after'], str(path)
              entries.append(dict(path=str(path), mode='100644', type='blob', content=after))
          result = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/git/trees', '--input', '-'], input=json.dumps({'base_tree':base_tree,'tree':entries}), text=True, capture_output=True)
          if result.returncode:
              raise RuntimeError('Content tree creation failed; no refs changed')
          tree = json.loads(result.stdout)['sha']
          assert tree == '4df642eb9a2382c935bbc7ecd90b7ed29b475c1a', tree
          print('Verified content tree: '+tree)
          print('No branch, tag, release, deployment, or workflow file changed by this job.')
          PY

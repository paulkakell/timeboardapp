name: Prepare nested-subtask review branch
on:
  push:
    branches: [fix/nested-subtasks-001303]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'paulkakell/timeboardapp' && github.ref == 'refs/heads/fix/nested-subtasks-001303'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Apply the checked patch only to this review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/nested-subtasks-001303'
          test "$(git rev-parse HEAD^)" = '75197342d977013b8cb2637e4df3a23d1051ab05'
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          raw = lzma.decompress(base64.b64decode(Path('.github/nested-payload.xz.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'd84719146caf69d70a6f37718184372c4c11edad6d4d4dcbe1e67dfd5a8e6ac4'
          data = json.loads(raw)
          patch = Path('/tmp/nested-subtasks.patch')
          patch.write_text(data['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          subprocess.run(['python', '-c', data['version_script']], check=True)
          architecture = Path('docs/docs/architecture.html')
          architecture.write_text(architecture.read_text().replace('<h2>Recurrence</h2>', data['architecture'] + '<h2>Recurrence</h2>'))
          subprocess.run(['python', 'scripts/sync_docs.py'], check=True)
          subprocess.run(['python', 'scripts/release_metadata.py'], check=True)
          PY
          rm .github/nested-payload.xz.b64 .github/workflows/prepare-nested-subtasks.yml
          python -m compileall -q app scripts
          python scripts/sync_docs.py --check
          python scripts/release_metadata.py --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(subtasks): restore nested branch ordering and navigation (00.13.03)'
          git push origin HEAD:refs/heads/fix/nested-subtasks-001303

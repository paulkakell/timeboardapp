name: Prepare reviewed MCP patch documentation
on:
  push:
    branches: [fix/mcp-oauth-issuer-identification]
    paths: [scripts/_prepare_mcp_release.py]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'paulkakell/timeboardapp' && github.ref == 'refs/heads/fix/mcp-oauth-issuer-identification' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate only the locally reviewed release tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c5f7f4f464dbbfd77ad1ba659e64aa4be22e970d
          test "$(git hash-object .github/workflows/audit.yml)" = 57c99969d5c4c1d81fd8774ac6118d124988c38d
          python scripts/_prepare_mcp_release.py
          python scripts/sync_docs.py
          python scripts/release_metadata.py
          python scripts/sync_docs.py --check
          python scripts/release_metadata.py --check
          git diff --check
          git diff --exit-code -- .github/workflows
          git rm scripts/_prepare_mcp_release.py
          git add -A
          index_copy="$(mktemp)"
          cp .git/index "$index_copy"
          GIT_INDEX_FILE="$index_copy" git update-index --force-remove .github/workflows/prepare-mcp-release.yml
          actual="$(GIT_INDEX_FILE="$index_copy" git write-tree)"
          rm "$index_copy"
          echo "Reviewed final tree: $actual"
          test "$actual" = e213251df4e6c04b24f5cb9b6254a4576fc1a933
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: prepare 00.14.01 issuer release and synchronized website' -m 'Apply the locally reviewed, tree-hash-verified release documentation, metadata, and browser/container assertions. Main is unchanged; final PR-head CI is required before merge.'
      - name: Advance only the unchanged authorized testing branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=refs/heads/fix/mcp-oauth-issuer-identification
          remote="$(git ls-remote origin "$branch" | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push origin "HEAD:$branch"
          echo "Prepared commit: $(git rev-parse HEAD)"
          echo 'The temporary preparation workflow must be removed through the connector before final CI and merge.'

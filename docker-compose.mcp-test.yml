# Standalone disposable test deployment; do not combine with production Compose.
services:
  timeboardapp:
    image: timeboardapp:mcp-testing
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: UTC
      TIMEBOARDAPP_BASE_URL: ${MCP_TEST_BASE_URL:?Set MCP_TEST_BASE_URL to the public HTTPS test origin}
      TIMEBOARDAPP_MCP_ENABLED: "true"
      TIMEBOARDAPP_MCP_REDIRECT_URIS: ${MCP_TEST_REDIRECT_URIS:-https://chatgpt.com/connector_platform_oauth_redirect}
    ports:
      - "127.0.0.1:${MCP_TEST_PORT:-18888}:8888"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${MCP_TEST_DATA:-./data/mcp-testing}:/data
